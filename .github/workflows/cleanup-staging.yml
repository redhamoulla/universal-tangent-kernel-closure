name: Remove temporary upload fragments

on:
  push:
    branches: [main]
    paths:
      - ".payload/**"
      - ".source/**"
      - ".github/source_payload/**"
      - "paper/.parts/**"
      - ".github/workflows/cleanup-staging.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary upload files
        run: |
          rm -rf .payload .source .github/source_payload paper/.parts

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary upload fragments"
          git pull --rebase origin main
          git push origin HEAD:main
