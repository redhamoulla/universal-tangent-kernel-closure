name: Build paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: universal_tangent_kernel_closure.tex
          working_directory: paper
          latexmk_use_xelatex: false

      - name: Commit compiled PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build paper PDF"
          file_pattern: paper/universal_tangent_kernel_closure.pdf
