name: Build paper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.source/**'
      - '.github/workflows/materialize-paper.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize LaTeX sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p paper
          base64 --decode .source/universal_tangent_kernel_closure.tex.gz.b64 | gzip --decompress > paper/universal_tangent_kernel_closure.tex
          base64 --decode .source/references.bib.gz.b64 | gzip --decompress > paper/references.bib

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: universal_tangent_kernel_closure.tex
          working_directory: paper

      - name: Commit paper and sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/universal_tangent_kernel_closure.tex paper/references.bib paper/universal_tangent_kernel_closure.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add paper PDF and LaTeX sources'
          git push
