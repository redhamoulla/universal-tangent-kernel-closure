name: Build paper

on:
  push:
    branches: [main]
    paths:
      - "paper/**/*.tex"
      - "paper/**/*.bib"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: universal_tangent_kernel_closure.tex
          working_directory: paper
          latexmk_use_xelatex: false

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: universal-tangent-kernel-closure-pdf
          path: paper/universal_tangent_kernel_closure.pdf
          if-no-files-found: error
